<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}NovaGear{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('home') }}">
                NovaGear
            </a>

            <nav
                class="site-nav"
                aria-label="Primary navigation"
            >
                <a
                    class="nav-link"
                    href="{{ url_for('home') }}"
                >
                    Products
                </a>

                {% if session.get("is_admin") %}
                    <a
                        class="nav-link"
                        href="{{ url_for('orders') }}"
                    >
                        Orders
                    </a>

                    <a
                        class="nav-link"
                        href="{{ url_for('admin_products') }}"
                    >
                        Manage Products
                    </a>

                    <a
                        class="nav-link"
                        href="{{ url_for('admin_monitor') }}"
                    >
                        Monitoring
                    </a>

                    <a
                        class="nav-link"
                        href="{{ url_for('admin_logs') }}"
                    >
                        Admin Logs
                    </a>

                    <form
                        class="nav-form"
                        action="{{ url_for('admin_logout') }}"
                        method="post"
                    >
                        <button
                            class="nav-link nav-button"
                            type="submit"
                        >
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a
                        class="nav-link"
                        href="{{ url_for('admin_login') }}"
                    >
                        Admin Login
                    </a>
                {% endif %}

                <a
                    class="nav-link"
                    href="{{ url_for('view_cart') }}"
                >
                    Cart
                    ({{ session.get("cart", {}).values() | sum }})
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            &copy; 2026 NovaGear. All rights reserved.

            <div class="instance-name">
                Served by {{ config["INSTANCE_NAME"] }}
            </div>
        </div>
    </footer>
</body>
</html>
