<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Simple Ecommerce Store{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('home') }}">
                Simple Ecommerce Store
            </a>

            <nav>
                <a href="{{ url_for('home') }}">
                    Products
                </a>

                <a href="{{ url_for('orders') }}">
                    Orders
                </a>

                {% if session.get("is_admin") %}
                    <a href="{{ url_for('admin_monitor') }}">
                        Monitoring
                    </a>

                    <a href="{{ url_for('admin_logs') }}">
                        Audit Log
                    </a>

                    <form
                        class="nav-form"
                        action="{{ url_for('admin_logout') }}"
                        method="post"
                    >
                        <button
                            class="nav-button"
                            type="submit"
                        >
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{{ url_for('admin_login') }}">
                        Admin Login
                    </a>
                {% endif %}

                <a href="{{ url_for('view_cart') }}">
                    Cart
                    ({{ session.get("cart", {}).values() | sum }})
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <div>Cloud Computing Course Project</div>
            <div class="instance-name">
                Served by {{ config["INSTANCE_NAME"] }}
            </div>
        </div>
    </footer>
</body>
</html>
